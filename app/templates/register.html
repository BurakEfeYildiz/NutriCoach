<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2e7d6b">
    <title>Kayıt Ol — NutriCoach</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo auth-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12a10 10 0 0 1 10-10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                </div>
                <h1 class="auth-title">NutriCoach</h1>
                <p class="auth-subtitle">Yeni bir hesap oluşturun ve koçunuzla tanışın</p>
            </div>

            <div id="authAlert" class="auth-alert hidden" role="alert"></div>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Adınız Soyadınız</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Örn. Burak Yıldız" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">E-posta Adresi</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="ornek@domain.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Şifre (En az 8 karakter)</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="passwordConfirm" class="form-label">Şifre Tekrar</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-input" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary auth-submit-btn" id="registerBtn">
                    <span>Hesap Oluştur</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="/login" class="auth-link">Giriş yapın</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const alertBox = document.getElementById('authAlert');
            const submitBtn = document.getElementById('registerBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.classList.add('hidden');

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const passwordConfirm = document.getElementById('passwordConfirm').value;

                if (!name || !email || !password || !passwordConfirm) {
                    alertBox.textContent = 'Lütfen tüm alanları doldurun.';
                    alertBox.className = 'auth-alert auth-alert-error';
                    alertBox.classList.remove('hidden');
                    return;
                }

                if (password.length < 8) {
                    alertBox.textContent = 'Şifre en az 8 karakter uzunluğunda olmalıdır.';
                    alertBox.className = 'auth-alert auth-alert-error';
                    alertBox.classList.remove('hidden');
                    return;
                }

                if (password !== passwordConfirm) {
                    alertBox.textContent = 'Şifreler birbiriyle eşleşmiyor.';
                    alertBox.className = 'auth-alert auth-alert-error';
                    alertBox.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Hesap oluşturuluyor...';

                try {
                    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Istanbul';
                    await api.register(name, email, password, timezone);
                    window.location.href = '/today';
                } catch (err) {
                    alertBox.textContent = err.message || 'Kayıt sırasında bir hata oluştu.';
                    alertBox.className = 'auth-alert auth-alert-error';
                    alertBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Hesap Oluştur';
                }
            });
        });
    </script>
</body>
</html>
